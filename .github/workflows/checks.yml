name: Verificações

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml
      - run: python -m pip install --upgrade 'pip>=26.2.2'
      - run: python -m pip install -r requirements-production.txt '.[dev]' pip-audit
      - run: pip-audit -r requirements-production.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: python -B -W error::ResourceWarning -m unittest discover -v
      - name: Validar distribuição instalada
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv /tmp/getping-installed
          /tmp/getping-installed/bin/pip install dist/*.whl
          cd /tmp
          /tmp/getping-installed/bin/python -I "$GITHUB_WORKSPACE/scripts/check-installed.py"
